name: Build and Push Docker Images

# on:
#   push:
#     branches:
#       - main
#   pull_request:
#     branches:
#       - main
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build and tag the frontend image (from root folder)
    - name: Build frontend Docker image
      run: |
        docker build -t thesecondbread/tasty-gold-ui:0.0.2 .

    # Build and tag the backend image (from backend folder)
    - name: Build backend Docker image
      working-directory: ./backend
      run: |
        docker build -t thesecondbread/tasty-gold-backend:0.0.2 .

    - name: Push frontend Docker image
      run: |
        docker push thesecondbread/tasty-gold-ui:0.0.2

    - name: Push backend Docker image
      run: |
        docker push thesecondbread/tasty-gold-backend:0.0.2
